# ashell -- the Hyprland session's status bar.
#
# Ported from config/waybar/config-hypr.jsonc. The module mapping:
#
#   waybar                  ->  ashell
#   hyprland/workspaces     ->  Workspaces
#   custom/cpucat           ->  CustomModule "cpucat"   (listen_cmd, catloop.sh)
#   custom/media            ->  CustomModule "media"    (listen_cmd, media-title.sh)
#   tray                    ->  Tray
#   wireplumber             ->  Settings "Audio" indicator
#   backlight               ->  Settings "Brightness" indicator
#   battery                 ->  Settings "Battery" indicator
#   clock                   ->  Tempo
#
# The Settings module is more than the three indicators it shows in the bar:
# its button opens the panel that also carries WiFi, Bluetooth, audio
# sink/source picking and the power menu, which is where the rest of waybar's
# right-hand modules end up.
#
# This file is GENERATED by theme-apply from themes/<slug>/palette.conf -- edit
# the palette (or the render_ashell_config template in local/bin/theme-apply),
# not this file. The palette lives in the [appearance] section at the bottom;
# everything above it is layout and is not theme-dependent.

position = "Top"
layer = "Top"

[modules]
left = [ "Workspaces", "cpucat" ]
center = [ "media" ]
right = [ [ "Tray", "Settings", "Tempo" ] ]

# -- workspaces --------------------------------------------------------------
# waybar's hyprland/workspaces shows the focused monitor's workspaces with the
# active one underlined in the accent colour. MonitorSpecific + the palette's
# workspace_colors reproduce that on a single-monitor machine.
[workspaces]
visibility_mode = "MonitorSpecific"

# -- custom modules ----------------------------------------------------------
# Both are Text modules driven by listen_cmd, not polls: the scripts stream
# frames / titles and ashell re-renders on each line. An empty Text module
# renders as zero-width, so "media" collapses when nothing is playing -- the
# same "hide when empty" behaviour waybar gets from "hide-empty-text": true.

[[CustomModule]]
name = "cpucat"
type = "Text"
listen_cmd = "bash ~/.config/ashell/scripts/catloop-json.sh"

[[CustomModule]]
name = "media"
type = "Text"
listen_cmd = "bash ~/.config/ashell/scripts/media-json.sh"

# -- settings ----------------------------------------------------------------
# The three indicators mirror waybar's wireplumber / backlight / battery, in
# the same order. The panel behind the Settings button adds WiFi, Bluetooth,
# audio sink/source picking and the power menu.
[settings]
indicators = [ "Audio", "Brightness", "Battery" ]
audio_indicator_format = "IconAndPercentage"
brightness_indicator_format = "IconAndPercentage"
battery_format = "IconAndPercentage"
# The same lock command the Hyprland keybind uses.
lock_cmd = "swaylock -C /home/water/.config/niri/lock.conf -f"
# The panel's "more" buttons open the real apps.
audio_sinks_more_cmd = "pavucontrol"
audio_sources_more_cmd = "pavucontrol"
wifi_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

# -- tempo (clock) -----------------------------------------------------------
# waybar's clock format, as a chrono strftime string.
[tempo]
clock_format = "%m-%d-%Y %I:%M %p"

# -- appearance (GENERATED by theme-apply) -----------------------------------
# The island colours follow waybar's colors.css: the bar is transparent and
# the module islands are painted in bg1 at 0.85 alpha, so the wallpaper shows
# through a little. Text stays opaque. Only the bar surface is translucent;
# menus and the OSD stay fully opaque.


[appearance]
# WaycatMono is JetBrainsMono Nerd Font with Waycat's A-L cat glyphs merged
# in (see scripts/merge-waycat-font.py), so the cpucat module renders the cat
# while every other glyph keeps the bar's font.
font_name = "WaycatMono"
primary_color = "#cba6f7"
success_color = "#a6e3a1"
warning_color = "#f9e2af"
danger_color = "#f38ba8"
text_color = "#cdd6f4"
workspace_colors = [ "#cba6f7" ]

[appearance.background_color]
base = "#181825"
weak = "#313244"
strong = "#45475a"

[appearance.opacity]
bar = 0.85

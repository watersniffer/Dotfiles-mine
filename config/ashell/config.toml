# ashell -- the Hyprland session's status bar.
#
# Ported from config/waybar/config-hypr.jsonc. The module mapping:
#
#   waybar                  ->  ashell
#   hyprland/workspaces     ->  Workspaces
#   tray                    ->  Tray
#   wireplumber             ->  Settings "Audio" indicator
#   backlight               ->  Settings "Brightness" indicator
#   battery                 ->  Settings "Battery" indicator
#   clock                   ->  Tempo
#   custom/cpucat           ->  removed; was a Text module, see [modules]
#   custom/media            ->  MediaPlayer, with transport in its menu
#
# The Settings module is more than the three indicators it shows in the bar:
# its button opens the panel that also carries WiFi, Bluetooth, audio
# sink/source picking and the power menu, which is where the rest of waybar's
# right-hand modules end up.
#
# This file is GENERATED by theme-apply from themes/<slug>/palette.conf -- edit
# the palette (or the render_ashell_config template in local/bin/theme-apply),
# not this file. The palette lives in the [appearance] section at the bottom;
# everything above it is layout and is not theme-dependent.

position = "Top"
layer = "Top"

[modules]
# cpucat was removed from the bar entirely: the module is out of [modules] and its
# [[CustomModule]] block below is gone too, so there is no leftover listen_cmd
# definition to confuse the next reader. It was a Text module driving
# scripts/catloop-json.sh, which forks waybar's catloop.sh to animate a sleeping
# cat in the top-left.
#
# Both scripts are still on disk and still work -- catloop-json.sh under
# config/ashell/scripts/, catloop.sh under config/waybar/scripts/. To bring the
# cat back: add "cpucat" to the list below and restore the [[CustomModule]] block
# from git history (it is one name, one type, one listen_cmd line). The font work
# for it is also still in place: install.sh still merges the cat glyphs into
# WaycatMono via scripts/merge-waycat-font.py, so the cat would render correctly
# rather than as plain letters.
#
# DankCal is a CustomModule Button beside the media title. It runs `dcal show`,
# which shows the calendar window if dcal is already running and launches it if
# not, so one keypress is a toggle without needing a separate close path.
#
# The three transport buttons were moved into the MediaPlayer dropdown, so the
# center of the bar is now just the track title plus this. They used to be
# separate CustomModule buttons here, which meant three extra interactive
# elements in the bar for controls the media menu already offers. See the
# [media_player] comment below for why they could never have been hidden when
# idle.
left = [ "Workspaces" ]
center = [ "MediaPlayer", "DankCal" ]
right = [ [ "Tray", "Notifications", "Settings", "Tempo" ] ]

# -- dank calendar -----------------------------------------------------------
# A button that shows DankCalendar. `dcal show` is idempotent in the useful
# direction: it raises the window when dcal is up and starts it when it is not.
# `dcal open` would also work, but show is the one documented for this.
#
# Right-click restarts dcal instead, because a quickshell UI that has wedged
# will not respond to a raise and a plain restart is the thing that fixes it.
# Middle-click goes to the account manager for adding a calendar.
#
# There is no icon key issue here the way there was for the media buttons: this
# is a Button with an icon, which is exactly what ashell draws icons for.
# `dcal ipc ui.toggle` rather than `dcal show`: show only ever raises, so a
# second press did nothing and the calendar could not be dismissed from the bar.
# ui.toggle hides it too. Verified -- mapped windows went 0 -> 2 -> 0 over three
# calls, each returning {"ok": true}. The view argument (month|week|day|agenda) is
# passed explicitly so it opens on the whole month, which is the quick-glance one.
#
# Why a separate window and not a dropdown drawn inside the bar: ashell cannot
# embed another application. A CustomModule is either type Text (renders a string
# from listen_cmd) or type Button (runs a command), and its 11 config fields are
# name/type/command/listen_cmd/icons/alert plus the four mouse bindings -- there is
# no content, panel or embed field anywhere. The dropdowns ashell draws can only
# contain ashell's own panels. DankCalendar is a separate Wayland client
# (WM_CLASS com.danklinux.dankcalendar) and its window size comes from dcal's own
# config in ~/.config/dankcal, which has no width/height key. A real dropdown needs
# the Quickshell shell, where a PanelWindow can host a calendar as panel content.
#
[[CustomModule]]
name = "DankCal"
command = "dcal ipc ui.toggle view=month"
icon = ""
on_right_click = "dcal restart"
on_middle_click = "dcal account"

# -- workspaces --------------------------------------------------------------
# waybar's hyprland/workspaces shows the focused monitor's workspaces with the
# active one underlined in the accent colour. MonitorSpecific + the palette's
# workspace_colors reproduce that on a single-monitor machine.
[workspaces]
visibility_mode = "MonitorSpecific"

# -- media player ------------------------------------------------------------
# The built-in MediaPlayer module shows the title (truncated) and opens a menu
# with the full track info plus play/pause, next and previous.
#
# The three transport buttons that used to sit beside it in the bar are gone; the
# menu is where they live now. They had been CustomModule type Button, because
# that was the only way to put an icon in the bar that runs playerctl. That
# arrangement had two problems worth recording, since it is why they are not
# coming back as bar buttons:
#
#   A Button cannot be hidden. ashell collapses a module to zero width only when
#   it is type Text, so a Button always draws its icon and always keeps its 1-unit
#   container padding (hardcoded in custom_module.rs, no config reaches it). The
#   earlier attempt to hide them until something was playing -- an `icons` regex
#   keyed on a listen_cmd frame, falling back to StaticIcon::None whose glyph is
#   "" -- therefore left a couple of pixels on screen even when idle. It needed
#   scripts/media-state.sh, a process polling every second, to achieve nothing
#   visible.
#
#   They were always interactive with nothing loaded. playerctl no-ops when no
#   player is on the bus, so pressing them did nothing, but they looked live.
#
# The menu ashell opens already offers the same three controls over the same
# player, so nothing was lost by moving them there.
[media_player]
indicator_format = "Text"
max_text_length = 20

# -- settings ----------------------------------------------------------------
# Only Audio is in the bar now. Brightness and Battery were dropped from this
# list, which is the only way to get their percentages out of it.
#
# The formats below are still configured, and still apply to the Settings panel,
# but nothing in the bar renders them any more. Why they were dropped rather than
# reformatted: ashell 0.10's SettingsFormat enum is exactly
#
#   Value, Percentage, IconAndPercentage, IconAndValue, IconAndTime, IconAndName
#
# so there is no icon-only option. Naming a bare "Icon" does not error -- it
# silently falls back to ashell's own default of IconAndPercentage, which is why
# an earlier attempt at "Icon" left "100%" sitting in the bar and looked like the
# change had not applied. Every icon-bearing value also carries a number.
#
# Nothing is lost: the panel behind the Settings button still opens with working
# volume and brightness sliders, one click away. Put "Brightness" or "Battery"
# back into the indicators list above to have them in the bar again, number and
# all -- there is no way to have the icon without the number.
[settings]
indicators = [ "Audio" ]
audio_indicator_format = "IconAndPercentage"
brightness_indicator_format = "IconAndPercentage"
battery_format = "IconAndPercentage"
# The same lock command the Hyprland keybind uses.
lock_cmd = "swaylock -C /home/water/.config/niri/lock.conf -f"
# The panel's "more" buttons open the real apps.
audio_sinks_more_cmd = "pavucontrol"
audio_sources_more_cmd = "pavucontrol"
wifi_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

# -- notifications ----------------------------------------------------------
# The Notifications module is the notification centre: its button opens a
# dropdown listing everything that has come in, and the list is what you scroll
# when you missed one. It sits between Tray and Settings because both of those
# are dropdown-style buttons and this belongs with them.
#
# This required giving up mako, and that was not a preference. There is exactly
# one org.freedesktop.Notifications bus name, so the daemon and a notification
# history cannot both have it: ashell asks for the name with
# AllowReplacement | ReplaceExisting, mako holds it, and ashell only logs
# "Bus name already owned" and carries on without ever receiving Notify. The
# dropdown would have been a permanently empty button. Verified both ways --
# with mako stopped, ashell took the name and mako then refused to start with
# "Failed to acquire service name: File exists".
#
# So ashell is the daemon, which means it also has to do the popups, hence
# toast = true. With toast = false and mako gone, notifications would have gone
# nowhere at all.
[notifications]
toast = true
toast_position = "TopRight"
toast_timeout = 5000
toast_limit = 5
toast_max_height = 150
show_bodies = true
show_timestamps = true
format = "%H:%M"
grouped = false

# -- tempo (clock) -----------------------------------------------------------
# waybar's clock format, as a chrono strftime string.
[tempo]
clock_format = "%m-%d-%Y %I:%M %p"

# -- appearance (GENERATED by theme-apply) -----------------------------------
# The island colours follow waybar's colors.css: the bar is transparent and
# the module islands are painted in bg1 at 0.85 alpha, so the wallpaper shows
# through a little. Text stays opaque. Only the bar surface is translucent;
# menus and the OSD stay fully opaque.


[appearance]
# WaycatMono is JetBrainsMono Nerd Font with Waycat's A-L cat glyphs merged
# in (see scripts/merge-waycat-font.py), so the cpucat module renders the cat
# while every other glyph keeps the bar's font.
font_name = "WaycatMono"
# This is the lever for BOTH font size and bar height: ashell lays the bar out
# from the font size times this scale, and there is no height key in [appearance]
# (verified against the 0.10.0 schema: bar takes surface, radius and margin only).
# The two move together, so a smaller font means a shorter bar -- measured on this
# machine: 0.90 gives a 34px bar and 0.70 a 23px one.
#
# 0.75 for a smaller font. It was 0.85 originally, raised to 0.90 while chasing
# a taller bar, and lowered again on request.
scale_factor = 0.75
primary_color = "#f2f2f2"
success_color = "#bdbdbd"
warning_color = "#c8c8c8"
danger_color = "#ffffff"
text_color = "#f2f2f2"
workspace_colors = [ "#f2f2f2" ]

[appearance.bar]
# surface and radius are left at ashell's defaults on purpose.
#
# surface = "solid" was tried, to fill the whole bar into one rectangle the way
# waybar's window background did. It has no effect: with an identical config
# except surface transparent vs solid, the two screenshots came out byte
# identical (md5 7fa909f2f27b both times). ashell 0.10 draws the bar window
# transparent regardless, and the capsules you see are painted per module, so
# there is no config key that merges them into one filled shape.
#
# radius wants a px suffix -- a bare `radius = 10` is rejected with "did not
# match any variant of untagged enum CssShorthand", and ashell accepts the
# literal token `10px`. But since radius only rounds the (invisible) bar window,
# setting it changes nothing either. It is left unset so the config does not
# carry a key that does nothing.
#
# waybar's 26px min-height has no ashell equivalent -- bar height comes from the
# font size times scale_factor above -- so scale_factor is the only lever there,
# and that one does work.
surface = "transparent"

[appearance.background_color]
base = "#1a1a1a"
weak = "#262626"
strong = "#3d3d3d"

[appearance.opacity]
bar = 0.95

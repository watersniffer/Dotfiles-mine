# ashell -- the Hyprland session's status bar.
#
# Ported from config/waybar/config-hypr.jsonc. The module mapping:
#
#   waybar                  ->  ashell
#   hyprland/workspaces     ->  Workspaces
#   custom/cpucat           ->  CustomModule "cpucat"   (listen_cmd, catloop.sh)
#   custom/media            ->  CustomModule "media"    (listen_cmd, media-title.sh)
#   tray                    ->  Tray
#   wireplumber             ->  Settings "Audio" indicator
#   backlight               ->  Settings "Brightness" indicator
#   battery                 ->  Settings "Battery" indicator
#   clock                   ->  Tempo
#
# The Settings module is more than the three indicators it shows in the bar:
# its button opens the panel that also carries WiFi, Bluetooth, audio
# sink/source picking and the power menu, which is where the rest of waybar's
# right-hand modules end up.
#
# This file is GENERATED by theme-apply from themes/<slug>/palette.conf -- edit
# the palette (or the render_ashell_config template in local/bin/theme-apply),
# not this file. The palette lives in the [appearance] section at the bottom;
# everything above it is layout and is not theme-dependent.

position = "Top"
layer = "Top"

[modules]
left = [ "Workspaces", "cpucat" ]
center = [ "MediaPlayer", "MediaPrev", "MediaPlayPause", "MediaNext" ]
right = [ [ "Tray", "Notifications", "Settings", "Tempo" ] ]

# -- workspaces --------------------------------------------------------------
# waybar's hyprland/workspaces shows the focused monitor's workspaces with the
# active one underlined in the accent colour. MonitorSpecific + the palette's
# workspace_colors reproduce that on a single-monitor machine.
[workspaces]
visibility_mode = "MonitorSpecific"

# -- custom modules ----------------------------------------------------------
# Both are Text modules driven by listen_cmd, not polls: the scripts stream
# frames / titles and ashell re-renders on each line. An empty Text module
# renders as zero-width, so "media" collapses when nothing is playing -- the
# same "hide when empty" behaviour waybar gets from "hide-empty-text": true.

[[CustomModule]]
name = "cpucat"
type = "Text"
listen_cmd = "bash ~/.config/ashell/scripts/catloop-json.sh"

# -- media player ------------------------------------------------------------
# The built-in MediaPlayer module shows the title (truncated) and opens a
# menu with the full track info and play/pause/next/prev. The three buttons
# beside it are the same controls as always-visible bar buttons, so the media
# area is title + transport without having to open the menu.
[media_player]
indicator_format = "Text"
max_text_length = 20

# -- media transport ----------------------------------------------------------
# The three buttons are the same controls as always-visible bar buttons, so
# the media area is title + transport without having to open the menu.
#
# They only appear when something is actually loaded, and that is done through
# the `icons` regex map rather than by hiding the module. ashell collapses a
# module to zero width only when it is type Text; a Button always draws its
# icon, so there is no way to make one of these genuinely absent. What a Button
# does support is swapping the icon by regex against the listen_cmd's `alt`
# field, and with no match it falls back to StaticIcon::None, whose glyph is the
# empty string. So: no `icon` key at all, and the glyph lives in the map keyed
# on "playing", which scripts/media-state.sh emits only while a player is on the
# bus. Left over when idle is ashell's own 1-unit padding on the icon
# container -- a couple of pixels, hardcoded in custom_module.rs, unreachable
# from config.
#
# Paused counts as loaded, deliberately: there is still something to skip back
# to, and hiding the controls on pause would mean resuming needs a click on the
# title first.

[[CustomModule]]
name = "MediaPrev"
command = "playerctl previous"
listen_cmd = "bash ~/.config/ashell/scripts/media-state.sh"
icons = { "^playing$" = "󰒮" }

[[CustomModule]]
name = "MediaPlayPause"
command = "playerctl play-pause"
listen_cmd = "bash ~/.config/ashell/scripts/media-state.sh"
icons = { "^playing$" = "󰐊" }

[[CustomModule]]
name = "MediaNext"
command = "playerctl next"
listen_cmd = "bash ~/.config/ashell/scripts/media-state.sh"
icons = { "^playing$" = "󰒭" }

# -- settings ----------------------------------------------------------------
# The three indicators mirror waybar's wireplumber / backlight / battery, in
# the same order. The panel behind the Settings button adds WiFi, Bluetooth,
# audio sink/source picking and the power menu.
[settings]
indicators = [ "Audio", "Brightness", "Battery" ]
audio_indicator_format = "IconAndPercentage"
brightness_indicator_format = "IconAndPercentage"
battery_format = "IconAndPercentage"
# The same lock command the Hyprland keybind uses.
lock_cmd = "swaylock -C /home/water/.config/niri/lock.conf -f"
# The panel's "more" buttons open the real apps.
audio_sinks_more_cmd = "pavucontrol"
audio_sources_more_cmd = "pavucontrol"
wifi_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

# -- notifications ----------------------------------------------------------
# The Notifications module is the notification centre: its button opens a
# dropdown listing everything that has come in, and the list is what you scroll
# when you missed one. It sits between Tray and Settings because both of those
# are dropdown-style buttons and this belongs with them.
#
# This required giving up mako, and that was not a preference. There is exactly
# one org.freedesktop.Notifications bus name, so the daemon and a notification
# history cannot both have it: ashell asks for the name with
# AllowReplacement | ReplaceExisting, mako holds it, and ashell only logs
# "Bus name already owned" and carries on without ever receiving Notify. The
# dropdown would have been a permanently empty button. Verified both ways --
# with mako stopped, ashell took the name and mako then refused to start with
# "Failed to acquire service name: File exists".
#
# So ashell is the daemon, which means it also has to do the popups, hence
# toast = true. With toast = false and mako gone, notifications would have gone
# nowhere at all.
[notifications]
toast = true
toast_position = "TopRight"
toast_timeout = 5000
toast_limit = 5
toast_max_height = 150
show_bodies = true
show_timestamps = true
format = "%H:%M"
grouped = false

# -- tempo (clock) -----------------------------------------------------------
# waybar's clock format, as a chrono strftime string.
[tempo]
clock_format = "%m-%d-%Y %I:%M %p"

# -- appearance (GENERATED by theme-apply) -----------------------------------
# The island colours follow waybar's colors.css: the bar is transparent and
# the module islands are painted in bg1 at 0.85 alpha, so the wallpaper shows
# through a little. Text stays opaque. Only the bar surface is translucent;
# menus and the OSD stay fully opaque.


[appearance]
# WaycatMono is JetBrainsMono Nerd Font with Waycat's A-L cat glyphs merged
# in (see scripts/merge-waycat-font.py), so the cpucat module renders the cat
# while every other glyph keeps the bar's font.
font_name = "WaycatMono"
# The bar is shorter than waybar's was, so the text is scaled down a little to
# keep it from filling the bar.
scale_factor = 0.85
primary_color = "#fabd2f"
success_color = "#b8bb26"
warning_color = "#fabd2f"
danger_color = "#fb4934"
text_color = "#fbf1c7"
workspace_colors = [ "#fabd2f" ]

[appearance.bar]
surface = "transparent"

[appearance.background_color]
base = "#3c3836"
weak = "#504945"
strong = "#665c54"

[appearance.opacity]
bar = 0.95

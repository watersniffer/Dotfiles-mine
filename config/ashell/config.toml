# ashell -- the Hyprland session's status bar.
#
# Ported from config/waybar/config-hypr.jsonc. The module mapping:
#
#   waybar                  ->  ashell
#   hyprland/workspaces     ->  Workspaces
#   tray                    ->  Tray
#   wireplumber             ->  Settings "Audio" indicator
#   backlight               ->  Settings "Brightness" indicator
#   battery                 ->  Settings "Battery" indicator
#   clock                   ->  Tempo
#   custom/cpucat           ->  removed; was a Text module, see [modules]
#   custom/media            ->  MediaPlayer, with transport in its menu
#
# The Settings module is more than the three indicators it shows in the bar:
# its button opens the panel that also carries WiFi, Bluetooth, audio
# sink/source picking and the power menu, which is where the rest of waybar's
# right-hand modules end up.
#
# This file is GENERATED by theme-apply from themes/<slug>/palette.conf -- edit
# the palette (or the render_ashell_config template in local/bin/theme-apply),
# not this file. The palette lives in the [appearance] section at the bottom;
# everything above it is layout and is not theme-dependent.

position = "Top"
layer = "Top"

[modules]
# cpucat was removed from the bar entirely: the module is out of [modules] and its
# [[CustomModule]] block below is gone too, so there is no leftover listen_cmd
# definition to confuse the next reader. It was a Text module driving
# scripts/catloop-json.sh, which forks waybar's catloop.sh to animate a sleeping
# cat in the top-left.
#
# Both scripts are still on disk and still work -- catloop-json.sh under
# config/ashell/scripts/, catloop.sh under config/waybar/scripts/. To bring the
# cat back: add "cpucat" to the list below and restore the [[CustomModule]] block
# from git history (it is one name, one type, one listen_cmd line). The font work
# for it is also still in place: install.sh still merges the cat glyphs into
# WaycatMono via scripts/merge-waycat-font.py, so the cat would render correctly
# rather than as plain letters.
#
# The three transport buttons were moved into the MediaPlayer dropdown, so the
# center of the bar is now just the track title. They used to be separate
# CustomModule buttons here, which meant three extra interactive elements in the
# bar for controls the media menu already offers. See the [media_player] comment
# below for why they could never have been hidden when idle.
left = [ "Workspaces" ]
center = [ "MediaPlayer" ]
right = [ [ "Tray", "Notifications", "Settings", "Tempo" ] ]

# -- workspaces --------------------------------------------------------------
# waybar's hyprland/workspaces shows the focused monitor's workspaces with the
# active one underlined in the accent colour. MonitorSpecific + the palette's
# workspace_colors reproduce that on a single-monitor machine.
[workspaces]
visibility_mode = "MonitorSpecific"

# -- media player ------------------------------------------------------------
# The built-in MediaPlayer module shows the title (truncated) and opens a menu
# with the full track info plus play/pause, next and previous.
#
# The three transport buttons that used to sit beside it in the bar are gone; the
# menu is where they live now. They had been CustomModule type Button, because
# that was the only way to put an icon in the bar that runs playerctl. That
# arrangement had two problems worth recording, since it is why they are not
# coming back as bar buttons:
#
#   A Button cannot be hidden. ashell collapses a module to zero width only when
#   it is type Text, so a Button always draws its icon and always keeps its 1-unit
#   container padding (hardcoded in custom_module.rs, no config reaches it). The
#   earlier attempt to hide them until something was playing -- an `icons` regex
#   keyed on a listen_cmd frame, falling back to StaticIcon::None whose glyph is
#   "" -- therefore left a couple of pixels on screen even when idle. It needed
#   scripts/media-state.sh, a process polling every second, to achieve nothing
#   visible.
#
#   They were always interactive with nothing loaded. playerctl no-ops when no
#   player is on the bus, so pressing them did nothing, but they looked live.
#
# The menu ashell opens already offers the same three controls over the same
# player, so nothing was lost by moving them there.
[media_player]
indicator_format = "Text"
max_text_length = 20

# -- settings ----------------------------------------------------------------
# The three indicators mirror waybar's wireplumber / backlight / battery, in
# the same order. The panel behind the Settings button adds WiFi, Bluetooth,
# audio sink/source picking and the power menu.
[settings]
indicators = [ "Audio", "Brightness", "Battery" ]
# Icon-only. These were IconAndPercentage, which put a number next to each of the
# three indicators -- three numbers permanently in the bar, for values that are
# also readable by looking at the slider in the panel behind this button. The
# audio and brightness panel behind the Settings button already has working
# sliders, so the numbers were duplicating what one click away already showed.
audio_indicator_format = "Icon"
brightness_indicator_format = "Icon"
battery_format = "Icon"
# The same lock command the Hyprland keybind uses.
lock_cmd = "swaylock -C /home/water/.config/niri/lock.conf -f"
# The panel's "more" buttons open the real apps.
audio_sinks_more_cmd = "pavucontrol"
audio_sources_more_cmd = "pavucontrol"
wifi_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

# -- notifications ----------------------------------------------------------
# The Notifications module is the notification centre: its button opens a
# dropdown listing everything that has come in, and the list is what you scroll
# when you missed one. It sits between Tray and Settings because both of those
# are dropdown-style buttons and this belongs with them.
#
# This required giving up mako, and that was not a preference. There is exactly
# one org.freedesktop.Notifications bus name, so the daemon and a notification
# history cannot both have it: ashell asks for the name with
# AllowReplacement | ReplaceExisting, mako holds it, and ashell only logs
# "Bus name already owned" and carries on without ever receiving Notify. The
# dropdown would have been a permanently empty button. Verified both ways --
# with mako stopped, ashell took the name and mako then refused to start with
# "Failed to acquire service name: File exists".
#
# So ashell is the daemon, which means it also has to do the popups, hence
# toast = true. With toast = false and mako gone, notifications would have gone
# nowhere at all.
[notifications]
toast = true
toast_position = "TopRight"
toast_timeout = 5000
toast_limit = 5
toast_max_height = 150
show_bodies = true
show_timestamps = true
format = "%H:%M"
grouped = false

# -- tempo (clock) -----------------------------------------------------------
# waybar's clock format, as a chrono strftime string.
[tempo]
clock_format = "%m-%d-%Y %I:%M %p"

# -- appearance (GENERATED by theme-apply) -----------------------------------
# The island colours follow waybar's colors.css: the bar is transparent and
# the module islands are painted in bg1 at 0.85 alpha, so the wallpaper shows
# through a little. Text stays opaque. Only the bar surface is translucent;
# menus and the OSD stay fully opaque.


[appearance]
# WaycatMono is JetBrainsMono Nerd Font with Waycat's A-L cat glyphs merged
# in (see scripts/merge-waycat-font.py), so the cpucat module renders the cat
# while every other glyph keeps the bar's font.
font_name = "WaycatMono"
# The bar is shorter than waybar's was, so the text is scaled down a little to
# keep it from filling the bar.
#
# Raised from 0.85 to 0.90 to add roughly 2px of bar height. ashell derives the
# bar's height from the font size times this scale -- there is no height key in
# [appearance] (verified against the 0.10.0 schema: bar takes surface, radius and
# margin only), so this is the lever that makes the bar taller.
scale_factor = 0.9
primary_color = "#f2f2f2"
success_color = "#bdbdbd"
warning_color = "#c8c8c8"
danger_color = "#ffffff"
text_color = "#f2f2f2"
workspace_colors = [ "#f2f2f2" ]

[appearance.bar]
# solid, not transparent. This is what makes the bar one continuous filled
# rectangle instead of a row of separate capsules: with surface = "transparent"
# the bar window paints nothing and only each module's own capsule is visible, so
# the gaps between modules read as breaks in the bar. surface = "solid" fills the
# whole bar with background_color.base, giving the single long rectangle that
# waybar drew with its own window background.
#
# radius and margin reproduce waybar's window#waybar block from
# config/waybar/style.css, which is the look being matched. Quoting the brace,
# since this template is an f-string and a bare one would end it:
#
#   "window#waybar"           ->   [appearance.bar]
#     background: transparent      surface  = "solid"   (see note above)
#     border-radius: 10px          radius   = 10
#     margin: 0px                  margin   = 0
#     min-height: 26px
#     padding: 2px 6px
#
# margin = 0 matters as much as the radius: ashell insets the whole bar from the
# screen edge by the margin, so any non-zero value leaves a gap down each side and
# splits the bar into floating pieces again. waybar's margin was 0.
#
# waybar's 26px min-height has no ashell equivalent -- the bar's height comes from
# the font size times scale_factor above -- so scale_factor is the only lever
# there.
surface = "solid"
radius = 10
margin = 0

[appearance.background_color]
base = "#1a1a1a"
weak = "#262626"
strong = "#3d3d3d"

[appearance.opacity]
bar = 0.95

[Settings]
# GTK 3 apps (Nemo among them). The theme name has to match what the live
# dconf setting says, otherwise Nemo and the GTK 4 apps end up looking
# different.
gtk-theme-name=Kripton
gtk-icon-theme-name=Papirus
gtk-font-name=Open Sans 10
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=18
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
# Off: the freedesktop sound theme's audio-volume-change.oga is the "water
# droplet" on every volume keypress.
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-application-prefer-dark-theme=1

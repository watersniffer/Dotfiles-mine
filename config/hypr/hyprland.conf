# Hyprland — the second session, alongside Niri.
#
# NOT a copy of config/niri/config.kdl, and it cannot be. The two compositors
# have different models: niri is scrollable (a column is a strip you consume
# and expel windows from) while Hyprland is a conventional columns WM. What
# matches is everything *around* the compositor — kitty, waybar, rofi, mako,
# wlogout, awww, and the seven themes — all of which are already palette-driven
# and compositor-agnostic. So the same themesw, the same wallpapers and the same
# keybinds work here, and the look is matched value for value below.
#
# The theme switcher patches the three colour values in this file, the same way
# it patches niri's focus ring, so Super+T restyles Hyprland too. Those lines
# are marked THEME below; do not reorder them.
#
# Reference for the niri values this mirrors:
#   niri blur          passes 2, offset 8.0      -> blur passes/size below
#   niri window-rule   opacity 0.90, radius 10  -> decoration below
#   niri shadow        range 7, colour bg0 60%  -> decoration.shadow below
#   niri cursor        Bibata-Modern-Classic 22 -> cursor below
#   niri gaps          7 in, 5 out              -> general below

# ---------------------------------------------------------------------------
# MONITOR
# ---------------------------------------------------------------------------
# Left to Hyprland's own detection on purpose. The old config had a
# monitors.conf, but it was empty in git (0 lines) and the machine has one
# panel, so a pinned mode line would only be a thing to go stale.
monitor = ,preferred,auto,1

# ---------------------------------------------------------------------------
# LOOK AND FEEL  (mirrors niri)
# ---------------------------------------------------------------------------
general {
    border_size = 0                # niri: border off
    gaps_in = 7
    gaps_out = 5
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10                   # niri: geometry-corner-radius 10
    rounding_power = 2.0
    active_opacity = 0.90           # niri: opacity 0.90
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 7
        render_power = 6
        color = 0x1e1e2e99          # THEME (bg0 at 60%)
    }

    # niri: blur passes 2, offset 8.0. Hyprland's "size" is the radius in px and
    # "passes" is the same dual-Kawase iteration count, so these are the direct
    # equivalents. new_optimizations is left on: it is Hyprland's default and
    # only changes the sampling, not the radius.
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
}

# THEME (accent) — the niri focus-ring colour. Hyprland has no border here
# (border_size 0), so this is the grab handle for the focus ring in layouts that
# draw one, and it is what theme-apply rewrites.
col.active_border = rgba(cba6f7ff)
col.inactive_border = rgba(6c7086ff)   # THEME (fg3)

# niri sets this so the desktop follows the palette; the same gsettings key
# drives GTK apps and the portal colour scheme, so Hyprland needs it too.
xkb {
    layout us
}

cursor {
    hotspot_padding = 1
    image = Bibata-Modern-Classic
    size = 22                       # niri: xcursor-size 22
}

misc {
    force_default_wallpaper = 0     # awww owns the wallpaper, not Hyprland
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    focus_on_activate = true
}

input {
    kb_layout = us
    follow_mouse = 1
    # Natural scrolling, matching the niri touchpad block.
    touchpad {
        natural_scroll = true
    }
    touch_device {
        natural_scroll = true
    }
}

# ---------------------------------------------------------------------------
# ENVIRONMENT
# ---------------------------------------------------------------------------
# SDDM launches the session directly, so .bashrc never runs and ~/.local/bin is
# missing from PATH. Without this every bind that calls a script in local/bin
# fails with "command not found". The order is the same one start-niri uses.
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_SCALE_FACTOR,0.92
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XCURSOR_SIZE,22
env = XCURSOR_THEME,Bibata-Modern-Classic
env = EDITOR,nvim
env = VISUAL,nvim
env = TERMINAL,kitty

# ---------------------------------------------------------------------------
# WINDOW RULES
# ---------------------------------------------------------------------------
# Kitty draws its own translucency (background_opacity in its kitty.conf), so
# Hyprland must not multiply an opacity on top the way it does for everything
# else. Same reason niri has a kitty rule at opacity 1.0.
windowrule = opacity 1.0, class:^(kitty)$

# The emoji picker: floating, centred, fixed size, and it must not steal focus.
# niri expresses this as open-floating/open-focused plus a default size.
windowrule = float, class:^(it\.mijorus\.smile)$
windowrule = size 500 400, class:^(it\.mijorus\.smile)$
windowrule = center, class:^(it\.mijorus\.smile)$
windowrule = no_focus, class:^(it\.mijorus\.smile)$

# ---------------------------------------------------------------------------
# AUTOSTART
# ---------------------------------------------------------------------------
# Same list, same order, as local/bin/niri-startup, which niri runs through
# spawn-at-startup. Duplicated rather than shared because the marker file keys
# on the compositor's own identifier: niri's on NIRI_SOCKET, this one on
# HYPRLAND_INSTANCE_SIGNATURE. One script serving both would let whichever
# session logged in first suppress the other's startup.
exec-once = pkill -x dunst
exec-once = mako
exec-once = systemctl --user restart xdg-desktop-portal.service
exec-once = waybar -c "$HOME/.config/waybar/config-hypr.jsonc" -s "$HOME/.config/waybar/style.css"
exec-once = $HOME/.local/bin/at_startup
# awww owns the wallpaper and has to be listening before one can be set.
exec-once = awww-daemon
exec-once = nm-applet
exec-once = wl-paste --watch cliphist store
exec-once = kitty

# ---------------------------------------------------------------------------
# ANIMATIONS  (mirrors niri)
# ---------------------------------------------------------------------------
animations {
    enabled = yes
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    # niri: workspace-switch spring damping-ratio 1.0, stiffness 1000. Stiff and
    # fast, so it settles in a few frames rather than drifting.
    workspace = custom, 1, 4, easeOutExpo, popin 87%
    windows = custom, 1, 4, easeOutExpo, fade 88%, slide -6%
    # niri: window-open 150ms ease-out-expo
    open = custom, 1, 3, easeOutExpo, fade 92%, slide -4%
    close = custom, 1, 5, easeInOutCubic, fade 90%, slide -4%
    layers = custom, 1, 3, easeOutQuint, fade
    fade = custom, 1, 4, easeOutQuint
    # niri sets input keyboard-layout-switcher to no animation
    window = custom, 1, 6, easeOutExpo, popin 80%
    border = custom, 1, 5, easeOutQuint
    specialWorkspace = custom, 1, 4, easeOutExpo, fade 96%
    workspaceIn = custom, 1, 4, easeOutExpo, slide -8%
    workspaceOut = custom, 1, 4, easeOutExpo, slide 8%
}

# ---------------------------------------------------------------------------
# KEYBINDINGS
# ---------------------------------------------------------------------------
#
# Mod is Super, same as niri. The ~90 binds below are the ones that translate
# directly. A further dozen in config.kdl are deliberately NOT here, because they
# are niri concepts rather than Hyprland gaps:
#
#   Mod+J / Mod+[   consume-or-expel-window-right     scrolling columns
#   Mod+.           expel-window-from-column          scrolling columns
#   Mod+Ctrl+C      center-visible-columns
#   Mod+R / Shift+R switch-preset-column-width(-back)
#   Mod+Ctrl+Shift+R switch-preset-window-height
#   Mod+Escape      toggle-keyboard-shortcuts-inhibit
#   Mod+Shift+V     switch-focus-between-floating-and-tiling
#   Mod+Shift+P     power-off-monitors
#   Mod+Ctrl+1..0   move-column-to-workspace-N
#   Mod+Shift+Ctrl+arrows  move-column-to-monitor-*
#
# The scroll-model ones (Mod+PgUp/PgDn, wheel, touchpad) are the remaining
# difference: here they move between *existing* workspaces rather than scrolling
# a strip, which is the closest honest equivalent.

$mainMod = SUPER

# --- launchers ---
bind = $mainMod, Return, exec, kitty
bind = $mainMod, E, exec, kitty --class yazi -e yazi
bind = $mainMod, B, exec, firefox
bind = $mainMod, D, exec, nemo
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, comma, exec, smile

# --- window management ---
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, J, exec, hyprctl dispatch splitratio
bind = $mainMod shift, V, movetoworkspace, special:minimised

# --- focus and move, window-oriented (niri's up/down) ---
bind = $mainMod, up, movefocus, up
bind = $mainMod, down, movefocus, down
bind = $mainMod, left, movefocus, left
bind = $mainMod, right, movefocus, right
bind = $mainMod shift, up, movewindow, up
bind = $mainMod shift, down, movewindow, down
bind = $mainMod shift, left, movewindow, left
bind = $mainMod shift, right, movewindow, right

# --- resize (niri's set-column-width / set-window-height) ---
bind = $mainMod, minus, resizewindowpixel, -10
bind = $mainMod, equal, resizewindowpixel, 10
bind = $mainMod shift, minus, resizewindowpixel, 0 -10
bind = $mainMod shift, equal, resizewindowpixel, 0 10
bind = $mainMod, Up, resizewindowpixel, 0 -10
bind = $mainMod, Down, resizewindowpixel, 0 10
bind = $mainMod shift, Up, resizewindowpixel, 0 -10
bind = $mainMod shift, Down, resizewindowpixel, 0 10
bind = $mainMod, Ctrl R, exec, hyprctl dispatch resizewindowpixel 0 0

# --- focus first/last (niri's Home / End) ---
bind = $mainMod, Home, movefocus, left, 1
bind = $mainMod, End, movefocus, right, 1
bind = $mainMod, Ctrl Home, movewindow, left 1
bind = $mainMod, Ctrl End, movewindow, right 1

# --- workspaces 1-10: focus, and move the window there ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod shift, 1, movetoworkspace, 1
bind = $mainMod shift, 2, movetoworkspace, 2
bind = $mainMod shift, 3, movetoworkspace, 3
bind = $mainMod shift, 4, movetoworkspace, 4
bind = $mainMod shift, 5, movetoworkspace, 5
bind = $mainMod shift, 6, movetoworkspace, 6
bind = $mainMod shift, 7, movetoworkspace, 7
bind = $mainMod shift, 8, movetoworkspace, 8
bind = $mainMod shift, 9, movetoworkspace, 9
bind = $mainMod shift, 0, movetoworkspace, 10

# --- previous / next workspace (niri's PgUp / PgDn and wheel) ---
bind = $mainMod, Up, workspace, e+1
bind = $mainMod, Down, workspace, e-1
bind = $mainMod, Prev, workspace, e+1
bind = $mainMod, Next, workspace, e-1
bind = $mainMod shift, Prev, movetoworkspace, e-1
bind = $mainMod shift, Next, movetoworkspace, e+1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- monitors (niri's Mod+Alt+arrows) ---
bind = $mainMod alt, left, movefocus, mon_left
bind = $mainMod alt, right, movefocus, mon_right
bind = $mainMod alt, up, movefocus, mon_up
bind = $mainMod alt, down, movefocus, mon_down

# --- drag and resize with the mouse ---
bindm = $mainMod, mouse:272, movewindow,
bindm = $mainMod, mouse:273, resizewindowpixel, 10

# --- the theme switcher, and the rest of local/bin ---
bind = $mainMod, T, exec, ~/.local/bin/themesw
bind = $mainMod, U, exec, wlogout
bind = $mainMod, P, exec, ~/.local/bin/powerprofile
bind = $mainMod, W, exec, ~/.local/bin/wallpaper-switcher
bind = $mainMod, Ctrl W, exec, ~/.local/bin/wallpaper-switcher all
bind = $mainMod shift, W, exec, ~/.local/bin/toggle-waybar
bind = $mainMod, C, exec, sh -c 'cliphist list | rofi -dmenu -theme ~/.config/rofi/config.rasi | cliphist decode | wl-copy'
bind = $mainMod alt, L, exec, swaylock -C ~/.config/niri/lock.conf -f
bind = $mainMod, S, exec, hyprctl dispatch togglespecialworkspace magic
bind = $mainMod shift, S, movetoworkspace, special:magic

# --- screenshots ---
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, P, exec, grim - | wl-copy

# --- brightness and volume ---
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause

# --- 3-finger horizontal workspace swipe (niri has no gesture equivalent) ---
gesture = 3, horizontal, workspace, e+1
gesture = 3, horizontal, workspace, e-1

# hyprlock -- the lock screen.
#
# Bound to Super+L, and also what config/hypr/hypridle.conf runs when the screen
# wakes after 15 minutes idle.
#
# WHY THIS FILE HAS TO EXIST
# --------------------------
# hyprlock has no usable built-in defaults. Run with nothing in place and it
# prints
#
#   CRIT: Config path error: Could not find config.
#        Searched in order: XDG_CONFIG_HOME, HOME, XDG_CONFIG_DIRS, /etc/xdg
#
# and exits 1, so Super+L did nothing at all and the hypridle wake path would have
# failed the same way. It looks for this file as ~/.config/hypr/hyprlock.conf,
# which is this directory.
#
# HOW TO CHECK THIS FILE WITHOUT LOCKING THE SCREEN
# -------------------------------------------------
# Do not just run `hyprlock` to test it. It daemonises, so killing the foreground
# process leaves the real locker holding the session lock -- which is exactly how a
# test locked this desktop earlier. Parse it against a display that does not exist:
#
#   WAYLAND_DISPLAY=definitely-not-a-socket hyprlock -c ~/.config/hypr/hyprlock.conf
#
# It parses the config, prints any errors, and then fails to connect. Exit 134 with
# the errors listed above it means the config is being read; nothing is locked.
#
# WHAT 0.9.6 ACTUALLY ACCEPTS
# ---------------------------
# Every value below was found by running the check above, not by reading about it.
#
#   colours are rgba(r,g,b,a), NOT hex.  `inner_color = #0d0d0d` fails with
#       `cannot parse "" as an int` -- an empty value, because the parser never gets
#       as far as the colour. rgba() is accepted by every colour key.
#   the background colour key is `color`. Neither `col` nor `literal` exists.
#   `general:hide_input` and `general:grace` do not exist in this version.
#
# The missing grace is worth knowing about: there is no delay between the screen
# waking and input being accepted, so a keypress that wakes the machine can also
# land in the password box. ignore_empty_input does not help -- it only skips an
# empty submit.
#
# Colours are the e-ink greys from config/waybar/colors.css, so the lock screen
# matches the bar and the launcher rather than arriving as the one colourful
# screen on the desktop.

general {
    ignore_empty_input = true
    hide_cursor = true
}

# A blurred screenshot rather than flat black: it keeps the session visible behind
# the prompt, so it is obvious the machine did not simply turn itself off.
# blur_passes is low because this is a 2015 laptop and the lock screen has to come
# up instantly on wake.
background {
    path = screenshot
    color = rgba(13,13,13,0.98)
    blur_passes = 2
    blur_size = 6
    vibrancy = 0.0
}

# LAYOUT
# ------
# position is an offset from the centre of the monitor, so on this 1366x768 panel
# the origin is (683, 384) and a label at "0, -200" sits at y=184.
#
# The first version of this file had two 64px labels at offsets +30 and +90 and an
# input-field with no position at all. That does not fit: a 64px glyph is about 77px
# tall, so the time at +30 spanned roughly y=376..452 while the input-field, being
# unpositioned, sat centred at 358..410. They overlapped, and the date at +90 then
# overlapped the time. Everything below is spaced with the glyph heights counted,
# not just the offsets:
#
#   time   font 60, offset -200 -> y=184, glyph ~72px  -> spans 148..220
#   date   font 22, offset -130 -> y=254, glyph ~26px  -> spans 241..267
#   input  320x48, offset  -40 -> y=344               -> spans 320..368
#   user   font 14, offset  250 -> y=634               -> spans 625..642
#
# Gaps: 21px between time and date, 53px between date and input, and the user line
# is 257px below the input field. Nothing comes within 100px of an edge.
#
# If the vertical sign turns out to be inverted on this build, the layout still does
# not overlap -- it just reads bottom-up -- so this is a safe thing to get wrong.
# To move one element, change its number and nothing else.

input-field {
    size = 320, 48
    position = 0, -40
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    outer_color = rgba(38,38,38,1)
    inner_color = rgba(13,13,13,1)
    font_color = rgba(242,242,242,1)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = true
    rounding = 8
    check_color = rgba(242,242,242,1)
    fail_color = rgba(118,118,118,1)
    fail_text = <i>$FAIL</i>
    capslock_color = rgba(160,160,160,1)
    invert_numlock = true
    swap_font_color = true
    halign = center
    valign = center
}

# Clock, date, prompt and user, top to bottom. The two clock labels are the only
# large text; the rest is deliberately small so nothing competes with the password
# field for attention.
label {
    text = cmd[update:1000] time
    color = rgba(242,242,242,1)
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date
    color = rgba(242,242,242,1)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

label {
    text = <i>$USER</i>
    color = rgba(160,160,160,1)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

confirm_os_window_close 0
font_size 10
font_family JetBrainsMono Nerd Font Mono
# Translucent, and this is the only knob for it: the niri window-rule for kitty
# sets opacity 1.0 so the compositor does not multiply this on top. Two dials
# for one effect is how kitty ends up at 0.77 when both are set.
#
# 0.88 rather than something see-through because the blur behind it is weak --
# niri's dual-kawase blur renders identically at passes 2 and 3 and barely
# changes with offset, so a very transparent window just turns into a smudge
# rather than frosted glass. This matches the 0.86 the rofi panels use.
#
# Startup-only: a running kitty needs `kitty @ load-config` or a restart to
# pick up a change here.
background_opacity          0.88
cursor_trail                1
# No padding: TUI apps (opencode, pacseek, btop, ...) render flush to the
# frame instead of floating in a solid-colour border.
window_padding_width        0

include current-theme.conf

# No terminal bell: readline and some TUI apps emit BEL, which was audible
# in kitty. Silent, with no visual flash either.
bell                 none

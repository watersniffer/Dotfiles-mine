confirm_os_window_close 0
font_size 10
font_family JetBrainsMono Nerd Font Mono

# --- Transparent, but the text still reads ---
#
# Three settings, because "see-through" and "readable" fight each other in kitty
# and neither one alone gives both. Alpha is the transparency; the other two are
# what keep the glyphs legible over a background that is now a moving target --
# a bright wallpaper coming through is not a colour the palette ever chose.
#
# 1. background_opacity is the transparency itself. The niri window-rule for
#    kitty sets opacity 1.0 so the compositor does not multiply on top; two dials
#    for one effect is how kitty ends up at 0.72 when both are set. The blur
#    behind it is weak (niri's dual-kawase blur renders identically at passes 2
#    and 3 and barely moves with offset), so going very transparent turns the
#    window into a smudge rather than frosted glass -- 0.75 is the useful floor
#    now that legibility no longer depends on the background staying dark.
#
# 2. text_fg_override_threshold 4.5 ratio is the important one. It is the WCAG AA
#    minimum contrast ratio, enforced: any colour a program asks for that would
#    fall below 4.5:1 against the background gets its perceived lightness moved
#    (HSLuv, so hue and saturation are preserved) until it clears the bar. This
#    is what makes text survive an arbitrary wallpaper behind it -- a dim grey
#    prompt on a dark theme, which is invisible at 0.75 opacity over a light
#    image, gets lifted until it is readable. Ratio mode rather than the percent
#    mode on purpose: percent mode forces fg to pure white or black, which
#    breaks the block-character graphics that btop and other TUIs draw.
#
# 3. text_composition_strategy takes the gamma and the multiplicative contrast as
#    two space-separated numbers, UNQUOTED. Quoting them looks reasonable and is
#    wrong: kitty reads the quote as part of the value and dies with
#    "ValueError: could not convert string to float: '\"1.0'", refusing to start
#    at all rather than ignoring the line. Linux defaults to 1.0 0; macOS
#    defaults to 1.0 30, which is why terminal text on a Mac looks noticeably
#    crisper. Taking the 30 gives the light-on-dark side of that, which is the
#    side a dark theme needs.
#
# Note there is no per-glyph outline in kitty 0.49: text_border_width and
# text_border_color are silently ignored ("Ignoring unknown config key"), so a
# text stroke, which is the usual way to do this elsewhere, is not available.
#
# Startup-only: a running kitty needs `kitty @ load-config` or a restart to
# pick any of this up.
#
# The frosted-glass look. This value is the half that lives in kitty: it makes
# the window translucent, so whatever the compositor draws behind it shows
# through. Kept at 0.75 because the other half -- the actual blur -- is done by
# the compositor, and dropping this much further costs legibility before it buys
# more effect.
#
# There is deliberately no `background_blur` here. It is the option that would
# normally do the frosting inside kitty, but it only works on Wayland when the
# compositor advertises ext-wlr-blur-v1, and Hyprland does not: it offers
# ext_background_effect_v1 instead. Setting it would be a line that looks
# deliberate and does nothing. The blur that actually applies is
# decoration.blur in config/hypr/hyprland-gui.lua, and it is visible here
# precisely because this number is below one.
background_opacity                  0.75
text_fg_override_threshold           4.5 ratio
text_composition_strategy            1.0 30

# The cursor tail.
#
# cursor_trail alone gives kitty's built-in plain trail, and it was already on at
# 1. The number is milliseconds, not a length: it is how long the cursor must
# sit still before a trail is drawn, so a low value like 1 means trails fire on
# almost every move. That is why this was set but there was not much to see.
# What was missing was a style -- custom_shaders is what turns the plain trail
# into an effect, and the shaders do nothing at all unless cursor_trail is above
# zero, so the two have to stay together.
#
# Only three trail shaders are installed here, and all three were checked by
# starting kitty with them rather than trusting the name:
#   cursor-trail-default, cursor-trail-blaze (fire), cursor-trail-lightning
# A fourth, cursor-trail-motion-blur, exists in kitty's git but is not in the
# Arch package, and asking for it fails at startup with
#   Failed to read custom shader pipeline definition ... No such file or
#   directory
# so it is not used. Blaze is the default here because it reads as motion rather
# than as a static smear, which suits the frosted-glass treatment; the other two
# are one word away in this same line.
custom_shaders              cursor-trail-blaze
cursor_trail                1
# How fast the tail fades. Two values: the first is the fast decay applied to
# the head of the trail, the second the slower one behind it.
cursor_trail_decay          0.1 0.4
# No padding: TUI apps (opencode, pacseek, btop, ...) render flush to the
# frame instead of floating in a solid-colour border.
window_padding_width        0

include current-theme.conf

# No terminal bell: readline and some TUI apps emit BEL, which was audible
# in kitty. Silent, with no visual flash either.
bell                 none

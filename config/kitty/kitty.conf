confirm_os_window_close 0
font_size 10
font_family JetBrainsMono Nerd Font Mono

# --- Transparency, without the glass ---
#
# Plain alpha and nothing else. The frosted-glass framing is gone: there is no
# compositor blur behind this window and no shader on it, so what is left is
# just the wallpaper showing through, which is what was actually wanted.
#
# text_fg_override_threshold is the setting that was removed, and it is the one
# worth explaining, because it was quietly breaking things. In "ratio" mode it
# does not style the terminal, it *rewrites the colours that programs ask for*:
# anything under 4.5:1 against the background had its perceived lightness moved
# until it cleared the WCAG bar. That is a reasonable idea for prose and a
# disaster for a TUI. btop, htop, lazygit and vim colour schemes all pick their
# own foregrounds, and every one of those got silently recoloured behind the
# program's back, which is why TUIs looked wrong and why picking a colour in a
# full-screen app did not stick. If legibility over a bright wallpaper ever
# becomes a problem again, text_composition_strategy below is the dial to reach
# for, not this.
#
# The blur is kept off by a window rule in config/hypr/hyprland.lua
# (kitty-no-blur) rather than by decoration.blur being off globally. That
# setting lives in hyprland-gui.lua, which hyprmod rewrites from its own state
# and has twice left blur enabled; a rule cannot be undone that way.
#
# Startup-only: a running kitty needs `kitty @ load-config` or a restart to
# pick any of this up.
background_opacity                  0.6
# Unquoted on purpose. kitty parses the quotes as part of the value and refuses
# to start with a float conversion error rather than ignoring the line. The 30
# is the multiplicative contrast, which is the light-on-dark half of what macOS
# does by default, and it is what keeps the text crisp over a bright wallpaper
# now that nothing is correcting the colours underneath it.
text_composition_strategy            1.0 30

# A plain block cursor, no tail.
#
# This used to be a fire effect: custom_shaders cursor-trail-blaze with
# cursor_trail 1. Both are gone. cursor_trail is how long the tail lasts in
# milliseconds, so 0 disables it (kitty's own default), and custom_shaders is
# what gave it the flame look. Both had to go together: the shaders do nothing
# while cursor_trail is 0, and cursor_trail on its own gives an untidy plain
# smear rather than nothing.
#
# cursor_shape is set explicitly rather than left implicit -- current-theme.conf
# sets cursor and cursor_text_color but not the shape, so shape is decided here.
#
# The three shaders are still installed, if the tail is ever wanted back:
#   /usr/lib/kitty/fonts/../shaders  (cursor-trail-default, -blaze, -lightning)
# Re-enabling needs both lines back (custom_shaders <name> and cursor_trail 1),
# and the file must be reloaded -- a running kitty only re-reads its config on
# `kitty @ load-config` or a restart.
cursor_shape               block
cursor_trail                0
# No padding: TUI apps (opencode, pacseek, btop, ...) render flush to the
# frame instead of floating in a solid-colour border.
window_padding_width        0

include current-theme.conf

# No terminal bell: readline and some TUI apps emit BEL, which was audible
# in kitty. Silent, with no visual flash either.
bell                 none

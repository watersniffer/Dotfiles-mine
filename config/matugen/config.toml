# Matugen configuration — optional manual theme generation.
# Matuwall has no hooks, so wallpaper changes do not alter the desktop palette.

[config]
type = "scheme-tonal-spot"

[templates.gtk-colors]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.gtk3-colors]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.kitty-theme]
input_path = "~/.config/matugen/templates/kitty-theme.conf"
output_path = "~/.config/kitty/current-theme.conf"

[templates.qt-colors]
input_path = "~/.config/matugen/templates/qt-colors.colors"
output_path = "~/.config/qt6ct/colors/Monochrome.conf"

[templates.waybar-colors]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.rofi-colors]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

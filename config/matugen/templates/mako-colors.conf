# Mako colours — generated by matugen from the current wallpaper.
# matugen-theme reads this file, rewrites the matching values in
# ~/.config/mako/config, and restarts mako (it cannot reload its config live).
# Format: [section] then key = #RRGGBB. The sections map onto mako's global
# block and its [urgency=...] blocks.

[default]
background = {{colors.surface_container_high.default.hex}}
text = {{colors.on_surface.default.hex}}
border = {{colors.primary.default.hex}}

[low]
background = {{colors.surface_container.default.hex}}
text = {{colors.on_surface_variant.default.hex}}
border = {{colors.outline_variant.default.hex}}

[normal]
background = {{colors.surface_container_high.default.hex}}
text = {{colors.on_surface.default.hex}}
border = {{colors.primary.default.hex}}

[critical]
background = {{colors.error_container.default.hex}}
text = {{colors.on_error_container.default.hex}}
border = {{colors.error.default.hex}}

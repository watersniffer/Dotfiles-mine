# Matuwall picker colours — generated by matugen from the current wallpaper.
# matugen-theme reads this file and rewrites the matching values in
# ~/.config/matuwall/config.toml, so the picker matches the desktop theme.
# Format is key = #RRGGBBAA; the alpha suffix is appended here because a
# template can only substitute whole values.

window_background = {{colors.surface_container_lowest.default.hex}}f2
tile              = {{colors.surface_container.default.hex}}e6
tile_border       = {{colors.outline_variant.default.hex}}ff
shadow            = {{colors.shadow.default.hex}}66
ring              = {{colors.primary.default.hex}}ff
spinner           = {{colors.primary.default.hex}}ff

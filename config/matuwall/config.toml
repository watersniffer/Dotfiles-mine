# Matuwall configuration — static Monochrome desktop.
#
# Deliberately has NO [hooks] section: the OS palette does NOT follow the
# wallpaper. Changing the wallpaper only swaps the background image.

[general]
directory = "~/Pictures/Wallpapers"
backend = "awww"

[window]
preview = true
close_on_focus_loss = false
position = "center"
background = "#1e1e2e"
margin = 34
edge_margin = 24
radius = 24

[input]
mouse = true

[animation]
navigation_ms = 200
zoom_percent = 6

[grid]
columns = 5
spacing = 14
radius = 12
border_width = 1
shadow_width = 0
ring_width = 2
visible_rows = 2
carousel = true
edge_peek = true

[thumbnail]
width = 260
height = 146

[colors]
tile = "#1e1e2eff"
border = "#45475aff"
shadow = "#1e1e2e99"
ring = "#cba6f7ff"
spinner = "#94e2d5ff"

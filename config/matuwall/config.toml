  # Matuwall configuration.
#
# Deliberately has NO [hooks] section: the OS palette does NOT follow the
# wallpaper. Changing the wallpaper only swaps the background image.
#
# The colours below are repainted by theme-apply along with everything else,
# so they follow the desktop theme even though the wallpaper does not.

[general]
directory = "~/Pictures/Wallpapers"
backend = "awww"

[window]
# Off: the grid thumbnails already show each wallpaper, so the full-screen
# preview behind the panel was only covering the desktop while browsing. This is
# also matuwall's own default. Enter, or a click, still applies.
preview = false
close_on_focus_loss = false
position = "center"
background = "#1e1e2e"
margin = 34
edge_margin = 24
radius = 24

[input]
mouse = true

[animation]
navigation_ms = 200
zoom_percent = 6

[grid]
columns = 5
spacing = 14
radius = 12
border_width = 1
shadow_width = 0
ring_width = 2
visible_rows = 2
carousel = true
edge_peek = true

[thumbnail]
width = 260
height = 146

[colors]
tile = "#2d353bff"
border = "#3d484dff"
shadow = "#2d353b99"
ring = "#a7c080ff"
spinner = "#83c092ff"

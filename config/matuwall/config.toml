  # Matuwall configuration.
#
# Deliberately has NO [hooks] section: the OS palette does NOT follow the
# wallpaper. Changing the wallpaper only swaps the background image, and the
# desktop keeps the E-ink colours below.
#
# These values are hand-set and committed, matching the E-ink palette that
# config/waybar/colors.css and config/rofi/colors.rasi also carry: bg0 #0d0d0d for
# the window behind the grid, bg1 #000000 for the tiles, bg3 #262626 for borders,
# fg0 #f2f2f2 for the selection ring, fg2 #a0a0a0 for the spinner. Nothing
# repaints them -- the previous [window] background was still Catppuccin Mocha's
# #1e1e2e, left over from when theme-apply rendered this file and only ever
# patched [colors].

[general]
directory = "~/Pictures/Wallpapers"
backend = "awww"

[window]
# Off: the grid thumbnails already show each wallpaper, so the full-screen
# preview behind the panel was only covering the desktop while browsing. This is
# also matuwall's own default. Enter, or a click, still applies.
preview = false
close_on_focus_loss = false
position = "center"
background = "#0d0d0d"
margin = 34
edge_margin = 24
radius = 24

[input]
mouse = true

[animation]
navigation_ms = 200
zoom_percent = 6

[grid]
columns = 5
spacing = 14
radius = 12
border_width = 1
shadow_width = 0
ring_width = 2
visible_rows = 2
carousel = true
edge_peek = true

[thumbnail]
width = 260
height = 146

[colors]
tile = "#0d0d0dff"
border = "#262626ff"
shadow = "#0d0d0d99"
ring = "#f2f2f2ff"
spinner = "#b2b2b2ff"

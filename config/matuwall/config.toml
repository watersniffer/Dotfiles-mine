# Matuwall configuration — wallpaper-driven theme.
#
# [hooks] on_apply regenerates the whole palette from the image that was just
# applied, so picking a wallpaper retheme the desktop. matugen-theme lives in
# ~/.local/bin, which is on the session PATH, and hooks run without a shell,
# so it is called by bare name. {path} is replaced with the wallpaper path.

[general]
directory = "~/Pictures/Wallpapers"
backend = "awww"

[window]
# Live preview: the wallpaper follows the highlighted tile as you browse, so
# choosing one is a gradual change rather than an instant jump.
preview = true
close_on_focus_loss = false
position = "center"
background = "#110c16f2"
margin = 34
edge_margin = 24
radius = 24

[input]
mouse = true

[animation]
navigation_ms = 200
zoom_percent = 6

[grid]
columns = 5
spacing = 14
radius = 12
border_width = 1
shadow_width = 0
ring_width = 2
visible_rows = 2
# Carousel scrolls the grid instead of jumping between rows.
carousel = true
edge_peek = true

[thumbnail]
width = 260
height = 146

[colors]
tile = "#231e28e6"
border = "#4b4450ff"
shadow = "#00000066"
ring = "#d9b9ffff"
spinner = "#d9b9ffff"

[hooks]
on_apply = [
     "matugen-theme {path}",
]

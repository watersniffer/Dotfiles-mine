[ColorScheme]
# Catppuccin Mocha, written in Qt's QPalette::ColorRole order, which is the
# order qt6ct serialises the arrays in:
#   0 Window        1 WindowText     2 Base          3 AlternateBase
#   4 ToolTipBase   5 ToolTipText    6 Text          7 Button
#   8 ButtonText    9 BrightText    10 Highlight    11 HighlightedText
#  12 Link         13 LinkVisited   14 Light        15 Midlight
#  16 Dark         17 Shadow        18 PlaceholderText
#  19 Accent       20 AccentText
#
# The Monochrome scheme this replaces had Window and Button set to a light
# grey, which is why the values are written out by role here instead of being
# translated positionally.
active_colors=#ff181825, #ffcdd6f4, #ff1e1e2e, #ff313244, #ff11111b, #ffcdd6f4, #ffcdd6f4, #ff313244, #ffcdd6f4, #fff5e0dc, #ff89b4fa, #ff1e1e2e, #ff89dceb, #ffcba6f7, #ff45475a, #ff585b70, #ff11111b, #ff11111b, #ff6c7086, #ffcba6f7, #ff1e1e2e, #ff313244
inactive_colors=#ff181825, #ffbac2de, #ff1e1e2e, #ff313244, #ff11111b, #ffbac2de, #ffbac2de, #ff313244, #ffbac2de, #ffa6adc8, #ff45475a, #ffcdd6f4, #ff7f849c, #ff7f849c, #ff45475a, #ff585b70, #ff11111b, #ff11111b, #ff6c7086, #ff7f849c, #ffcdd6f4, #ff313244
disabled_colors=#ff181825, #ff6c7086, #ff1e1e2e, #ff313244, #ff11111b, #ff6c7086, #ff6c7086, #ff313244, #ff6c7086, #ff6c7086, #ff45475a, #ffcdd6f4, #ff6c7086, #ff6c7086, #ff45475a, #ff585b70, #ff11111b, #ff11111b, #ff585b70, #ff6c7086, #ffcdd6f4, #ff313244

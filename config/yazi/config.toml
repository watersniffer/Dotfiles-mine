# Yazi configuration.
#
# Restored from ~/niri-dotfiles/yazi/yazi.toml, which the current repo never
# picked up, so yazi had been running on its built-in defaults. Those default to
# `vi` for the edit opener, and there is no /usr/bin/vi on this machine (only
# /usr/bin/vim and /usr/bin/nvim), so opening a file from yazi died with
# "process exited with status code 127".
#
# yazi reads ~/.config/yazi/config.toml -- the old file was named yazi.toml,
# which this version does not look for.
#
# Every opener here has its tool installed: nvim, xdg-open, zathura and 7z.
#
# Four were removed, each commented out below rather than left pointing at a
# command that no longer exists -- a missing opener fails with "command not
# found" and exit 127 on a keypress, which is the same silent breakage the vi
# opener caused at the top of this file. If one is ever wanted back:
#
#   celluloid   pacman -S celluloid          (play)
#   glow        pacman -S glow               (markdown)
#   exiftool    pacman -S perl-image-exiftool, but note that package only
#               Provides: exiftool and installs its script as
#               /usr/bin/vendor_perl/exiftool, putting nothing on $PATH, so it
#               also needs local/bin/exiftool          (reveal, second entry)
#   ebook-viewer   calibre, 136 MB and 69 packages for one file type (ebook)

# Yazi configuration file

[opener]
# play = [                                        # celluloid, removed
#     { run = 'celluloid "$@"', orphan = true, for = "unix" },
# ]
edit = [
    { run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
]
open = [
    { run = 'xdg-open "$1"', desc = "Open", for = "unix" },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "unix" },
    # { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
pdf = [
    { run = 'zathura "$1"', desc = "Open with Zathura", for = "unix" },
]
# markdown = [                                     # glow, removed
#     { run = 'glow "$1"', desc = "View with glow", for = "unix" },
# ]
extract = [
    { run = '7z x "$1"', block = true, desc = "Extract with 7z", for = "unix" },
]
view_archive = [
    { run = 'if [ -f "$1" ]; then case "$1" in *.tar) tar tf "$1" ;; *.zip) unzip -l "$1" ;; *.rar) unrar l "$1" ;; *.7z) 7z l "$1" ;; esac; echo "Press enter to exit"; read _; fi', block = true, desc = "View archive contents", for = "unix" },
]
# The ebook opener is gone: ebook-viewer came from calibre, which was removed as
# bloat. Leaving the rule in place is worse than having none -- it fails with
# "command not found" and exit 127, the same silent breakage the vi opener had.
# An .epub now has no [open] rule, so Enter does nothing and `reveal` still
# shows its details. If epubs are wanted back, foliate is a much smaller
# install than calibre (which pulled 69 packages for 136 MB) and this line
# becomes { run = 'foliate "$1"', ... }.
# ebook = [
#     { run = 'ebook-viewer "$1"', desc = "Open with ebook-viewer", for = "unix" },
# ]

[open]
rules = [
    # Folder
    { name = "*/", use = ["open", "edit", "reveal"] },
    # Text (this already covers markdown, so there is no separate rule for it --
    # it used to name the glow opener, which is gone)
    { mime = "text/*", use = ["edit", "reveal"] },
    # Image
    { mime = "image/*", use = ["open", "reveal"] },
    # Media: "play" was celluloid and is gone, so these go to xdg-open, which
    # hands the file to whatever the desktop has registered for it
    { mime = "video/*", use = ["open", "reveal"] },
    { mime = "audio/*", use = ["open", "reveal"] },
    # Archive
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "view_archive", "reveal"] },
    # PDF
    { mime = "application/pdf", use = ["pdf", "reveal"] },
    # Ebooks: no opener, see the note where the ebook opener used to be.
    # { mime = "application/epub+zip", use = ["ebook", "reveal"] },
    # JSON
    { mime = "application/{json,ndjson}", use = ["edit", "reveal"] },
    # JavaScript
    { mime = "*/javascript", use = ["edit", "reveal"] },
    # Empty file
    { mime = "inode/empty", use = ["edit", "reveal"] },
    # Fallback
    { name = "*", use = ["open", "reveal"] },
]

[mgr]
show_hidden = true

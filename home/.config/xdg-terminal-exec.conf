[Desktop Entry]
# Default terminal for the freedesktop xdg-terminal-exec mechanism, which is
# what GNOME's org.gnome.desktop.default-applications.terminal points at
# ("xdg-terminal-exec"). Without this file the choice is undefined, so any app
# that asks to open a terminal -- Nemo's "Open in Terminal", for one -- can
# land on a different emulator. Kitty.
DefaultTerminal=kitty.desktop

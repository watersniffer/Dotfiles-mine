[Theme]
Current=hyprsddm

[Users]
HideShells=/usr/bin/nologin,/usr/bin/fish
HideUsers=nobody,gdm,test

[General]
# Niri is the default session. Hyprland is registered as a second session and is
# selectable as "Hyprland" at the login screen, but it is not the default: niri
# is the one that gets used day to day. The two share kitty, waybar, rofi, mako,
# awww, brightness-step and all seven themes, so switching between them changes
# the window management model and a handful of binds and nothing else.
#
# The greeter theme below (hyprsddm) is unrelated to the Hyprland session -- it
# is the on-screen keyboard, and it serves whichever session logs in.
Session=niri-dotfiles.desktop

[Theme]
Current=hyprsddm

[Users]
HideShells=/usr/bin/nologin,/usr/bin/fish
HideUsers=nobody,gdm,test

[General]
# Niri is the only dotfiles session. Hyprland was a second session for a while
# and has been removed: its config, package and session entry are gone, and the
# theme switcher no longer knows about it. The greeter theme below (hyprsddm) is
# unrelated and still used -- it is the on-screen keyboard for this session.
Session=niri-dotfiles.desktop

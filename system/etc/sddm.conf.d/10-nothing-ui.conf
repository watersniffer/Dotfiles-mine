[Theme]
Current=hyprsddm

[Users]
HideShells=/usr/bin/nologin,/usr/bin/fish
HideUsers=nobody,gdm,test

[General]
# Niri is the default session. Hyprland is still installed and selectable as
# "Hyprland" at the login screen, but it is not the default: the two share
# kitty, waybar, rofi, mako, awww and all seven themes, so niri is the one
# that gets used day to day. Hyprland was left in place rather than removed
# because its config (config/hypr/hyprland.lua) is kept in the repo and works.
Session=niri-dotfiles.desktop

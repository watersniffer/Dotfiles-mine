[Theme]
Current=hyprsddm

[Users]
HideShells=/usr/bin/nologin,/usr/bin/fish
HideUsers=nobody,gdm,test

[General]
# Hyprland is the default session; niri-dotfiles.desktop stays registered and
# selectable at the login screen. The two share kitty, waybar, rofi, mako,
# awww and all seven themes, so switching between them changes only the window
# management model and a handful of binds.
Session=hyprland-dotfiles.desktop

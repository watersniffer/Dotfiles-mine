[Theme]
Current=hyprsddm

[Users]
HideShells=/usr/bin/nologin,/usr/bin/fish
HideUsers=nobody,gdm,test

[General]
# Hyprland is the default session, entered through the dotfiles entry so it
# picks up ~/.config/hypr/hyprland.lua. That config is a copy of the package's
# own /usr/share/hypr example with only its bind block replaced: gaps, borders,
# rounding, opacity, layout and animations are the shipped ones, and this repo
# contributes the autostart list and the keybinds.
#
# niri-dotfiles.desktop used to be registered here too, and was the session this
# repo's theme switcher drove. Niri is uninstalled and the session file is gone, so
# it pointed at a script that no longer existed.
#
# The greeter theme below (hyprsddm) is unrelated to the session -- it is
# the on-screen keyboard.
Session=hyprland-dotfiles.desktop

[Theme]
Current=hyprsddm

[Users]
HideShells=/usr/bin/nologin,/usr/bin/fish
HideUsers=nobody,gdm,test

[General]
# Hyprland is the default session, and it is the Arch package's own entry. This
# repo deliberately keeps no Hyprland config at all: there is no config/hypr, and
# ~/.config/hypr is left absent so Hyprland falls back to the stock
# /usr/share/hypr/hyprland.lua that ships with the package. Anything that
# symlinked a dotfiles config in front of it would stop it being stock.
#
# niri-dotfiles.desktop stays registered and selectable, and it is the session
# this repo's theme switcher drives.
#
# The greeter theme below (hyprsddm) is unrelated to either session -- it is
# the on-screen keyboard.
Session=hyprland.desktop

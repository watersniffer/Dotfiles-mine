# Catppuccin Mocha -- the default desktop theme.
#
# Roles used by every rendered app file. The names are deliberately generic
# rather than Catppuccin's own (base/mantle/surface0/...), so a theme that has
# no such concept, like Gruvbox, maps onto them just as well.
#
#   bg0  darkest surface   (base)
#   bg1  one step up       (mantle)
#   bg2  surface           (surface0)
#   bg3  raised surface    (surface1)
#   bg4  border/highlight  (surface2)
#   fg0  primary text      (text)
#   fg1  secondary text    (subtext1)
#   fg2  dim text          (overlay1)
#   fg3  faintest text     (overlay0)

name  = Catppuccin Mocha
nvim  = catppuccin-mocha
btop  = catppuccin_mocha

bg0   = #1e1e2e
bg1   = #181825
bg2   = #313244
bg3   = #45475a
bg4   = #585b70

fg0   = #cdd6f4
fg1   = #bac2de
fg2   = #7f849c
fg3   = #6c7086

red     = #f38ba8
green   = #a6e3a1
yellow  = #f9e2af
blue    = #89b4fa
magenta = #cba6f7
cyan    = #94e2d5

# Catppuccin calls this one peach.
orange  = #fab387

accent   = #cba6f7
on_accent = #1e1e2e
urgent   = #f38ba8

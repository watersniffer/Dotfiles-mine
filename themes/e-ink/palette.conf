# E-ink: dark greyscale for a high-contrast, glare-free desktop.
#
# Every accent is a grey, because an e-ink panel only renders luminance. The
# shades are stepped so the "colours" still separate from each other in a
# terminal and in diff views, and urgent is pushed to pure white rather than a
# red that would come out mid-grey and read as nothing.
#
# nvim uses colors/eink.vim in this repo: there is no e-ink colorscheme to
# install, and this one is a straight greyscale highlight set.

name  = E-ink
nvim  = eink
btop  = e_ink
wallpapers = E-ink

bg0   = #0d0d0d
bg1   = #000000
bg2   = #1a1a1a
bg3   = #262626
bg4   = #3d3d3d

fg0   = #f2f2f2
fg1   = #d0d0d0
fg2   = #a0a0a0
fg3   = #767676

red     = #dcdcdc
orange  = #d2d2d2
yellow  = #c8c8c8
green   = #bdbdbd
cyan    = #b2b2b2
blue    = #a8a8a8
magenta = #e0e0e0

accent   = #f2f2f2
on_accent = #0d0d0d
urgent   = #ffffff

# Everforest (dark flavour).
#
# bg1 is everforest's "bg1", a shade darker than bg0, which is the usual dark
# flavour convention. fg1 is interpolated: everforest's dark flavour gives
# fg0 and fg1 the same value.

name  = Everforest Dark
nvim  = everforest
btop  = everforest_dark

bg0   = #2d353b
bg1   = #232a2e
bg2   = #343f44
bg3   = #3d484d
bg4   = #475258

fg0   = #d3c6aa
fg1   = #b7c3b0
fg2   = #9da9a0
fg3   = #859289

red     = #e67e80
orange  = #e69875
yellow  = #dbbc7f
green   = #a7c080
cyan    = #83c092
blue    = #7fbbb3
magenta = #d699b6

accent   = #a7c080
on_accent = #2d353b
urgent   = #e67e80

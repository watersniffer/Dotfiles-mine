# Greyscale — pure monochrome, no colour anywhere.
#
# Unlike the rice this came from, which called itself monochrome but shipped grey
# with a purple accent (#C4A7E7, #e0def4, #5b4950), this has no hue at all. Every
# role is the same grey ramp, so nothing on the desktop can introduce colour that
# the palette did not choose.
#
# The ramp is even: bg0..bg4 and fg0..fg3 step by a roughly constant interval, so
# the ordering between roles is predictable and a border is always visible
# against the surface behind it.
#
#   bg0..bg4   #0a0a0a -> #262626   surfaces, darkest to lightest
#   fg3..fg0   #8a8a8a -> #f0f0f0   text, dimmest to brightest
#   accent     #f0f0f0              the brightest text colour
#
# The accent is grey rather than a hue on purpose: it is used for the active
# workspace underline and the selected state, so it has to be the most legible
# thing on screen. on_accent is then the darkest surface, which gives maximum
# contrast if it is ever used as a fill behind accent text.

name  = Greyscale
nvim  = monochrome
btop  = monochrome
wallpapers = Greyscale

bg0   = #0a0a0a
bg1   = #121212
bg2   = #1a1a1a
bg3   = #222222
bg4   = #262626

fg0   = #f0f0f0
fg1   = #d4d4d4
fg2   = #b0b0b0
fg3   = #8a8a8a

red     = #d0d0d0
orange  = #c4c4c4
yellow  = #b8b8b8
green   = #acacac
cyan    = #a0a0a0
blue    = #949494
magenta = #e0e0e0

accent   = #f0f0f0
on_accent = #0a0a0a
urgent   = #ffffff

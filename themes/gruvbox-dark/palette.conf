# Gruvbox Dark.
#
# Roles: bg0 is gruvbox's bg0 (#282828), bg1 is bg0_hard (#1d2021, darker),
# bg2/bg3/bg4 walk up through bg1/bg2/bg3. fg0..fg3 are fg0..fg3.
# The accent is gruvbox's yellow, which is the colour its own bar themes use.

name  = Gruvbox Dark

# gruvbox.nvim only ships colors/gruvbox.lua. There is no gruvbox-dark,
# and theme.lua silently falls back to tokyonight when a name will not load.
nvim  = gruvbox
btop  = gruvbox_dark

bg0   = #282828
bg1   = #1d2021
bg2   = #3c3836
bg3   = #504945
bg4   = #665c54

fg0   = #fbf1c7
fg1   = #ebdbb2
fg2   = #d5c4a1
fg3   = #a89984

red     = #fb4934
green   = #b8bb26
yellow  = #fabd2f
blue    = #83a598
magenta = #d3869b
cyan    = #8ec07c
orange  = #fe8019

accent   = #fabd2f
on_accent = #1d2021
urgent   = #fb4934

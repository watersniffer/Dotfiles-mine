# Nord (dark).
#
# Nord's own ramp is four dark greys and three light ones, so bg0..bg4 map
# straight onto nord0..nord3 plus one interpolated step, and fg0..fg3 onto
# nord6/nord4 plus the two comment greys Nord's dark ports use. Every accent is
# an official frost or aurora value.

name  = Nord Dark
nvim  = nord
btop  = nord_dark
wallpapers = Nord

bg0   = #2e3440
bg1   = #292e3a
bg2   = #3b4252
bg3   = #434c5e
bg4   = #4c566a

fg0   = #eceff4
fg1   = #d8dee9
fg2   = #7b88a1
fg3   = #616e88

red     = #bf616a
orange  = #d08770
yellow  = #ebcb8b
green   = #a3be8c
cyan    = #8fbcbb
blue    = #88c0d0
magenta = #b48ead

accent   = #88c0d0
on_accent = #2e3440
urgent   = #bf616a

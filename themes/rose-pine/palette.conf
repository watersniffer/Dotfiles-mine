# Rosé Pine (main).
#
# Note the direction of the dark surfaces: in Rosé Pine the crust is the
# *lightest* of base/mantle/crust, the opposite of Catppuccin, so bg0 is the
# darkest and each step up gets lighter. bg3/bg4 and fg3 are interpolated -- the
# palette has no fourth surface and no fourth text weight.

name  = Rosé Pine
nvim  = rose-pine
btop  = rose_pine

bg0   = #191724
bg1   = #1f1d2e
bg2   = #26233a
bg3   = #302d41
bg4   = #403d52

fg0   = #e0def4
fg1   = #908caa
fg2   = #6e6a86
fg3   = #565469

red     = #eb6f92
orange  = #eb8f7e
yellow  = #f6c177
green   = #9ccfd8
cyan    = #31748f
blue    = #31748f
magenta = #c4a7e7

accent   = #c4a7e7
on_accent = #191724
urgent   = #eb6f92

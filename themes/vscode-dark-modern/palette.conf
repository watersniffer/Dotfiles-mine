# VS Code Dark Modern.
#
# Taken from the theme VS Code actually uses when workbench.colorTheme is not
# set, which is the case here: 1.138's default dark theme. The chrome in Dark
# Modern is *darker* than the editor, the opposite of most of these palettes --
# the side bar, title bar, status bar and tabs are all #181818 against a
# #1F1F1F editor -- so bg1 is darker than bg0.
#
# The accents are the ones you see constantly in a VS Code file: green comments,
# salmon strings, blue keywords, teal types, yellow functions, and the #0078D4
# focus blue.
#
# vscode is the only palette that sets the "vscode" role. theme-apply writes it
# to workbench.colorTheme, so switching to this theme also switches the editor;
# the other six leave VS Code's own setting alone.

name  = VS Code Dark Modern
nvim  = vscode-dark-modern
btop  = vscode_dark
vscode = Default Dark Modern

bg0   = #1f1f1f
bg1   = #181818
bg2   = #202020
bg3   = #313131
bg4   = #3c3c3c

fg0   = #cccccc
fg1   = #9cdcfe
fg2   = #6e7681
fg3   = #767676

red     = #f44747
orange  = #ce9178
yellow  = #dcdcaa
green   = #6a9955
cyan    = #4ec9b0
blue    = #569cd6
magenta = #c586c0

accent   = #0078d4
on_accent = #ffffff
urgent   = #f44747
